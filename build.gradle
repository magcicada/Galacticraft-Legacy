plugins {
    id 'java'
    id 'eclipse'
    id 'maven-publish'
    id 'org.cadixdev.licenser' version '0.6.1'
    id 'com.diffplug.spotless' version '6.13.0'
    id 'net.minecraftforge.gradle' version '5.+'
//    id 'net.galacticraft.changelog' version '1.0.1'
//    id 'net.galacticraft.internal.legacy' version '1.0.0'
//    id 'net.galacticraft.internal.maven' version '1.0.0'
//    id 'nexus-publishing' version '2.1'
}

group = "dev.galacticraft"
archivesBaseName = "Galacticraft"
version = "${mod_version}${version_suffix}"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

repositories {
    mavenCentral()
    mavenLocal()
    flatDir dirs: "$projectDir/deps"

//    maven {
//        name 'galacticraft'
//        url 'https://maven.galacticraft.net/repository/legacy-common/'
//    }
}

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}

jar {
    manifest {
        attributes("Implementation-Title": "Galacticraft",
                "Implementation-Version": "4.0.7",
                "Specification-Title": "Galacticraft",
                "Specification-Vendor": "TeamGalacticraft",
                "Specification-Version": "4.0.7",
                "Implementation-Vendor": "TeamGalacticraft",
                "FMLAT": "accesstransformer.cfg",
                "FMLCorePluginContainsFMLMod": true,
                "FMLCorePlugin": "micdoodle8.mods.miccore.MicdoodlePlugin",
                "Built-On-Minecraft": "1.12.2",
                "Built-On-Forge": "14.23.5.2860",
                "Built-On-Mapping": "stable-39-1.12",
                "Built-Using": "ForgeGradle: 5.+")
    }
    // Specification-Title: Galacticraft
    //Specification-Vendor: TeamGalacticraft
    //Specification-Version: unspecified
    //Implementation-Title: Galacticraft
    //Implementation-Version: unspecified
    //Implementation-Vendor: TeamGalacticraft
    //Implementation-Build-Date: 2023-07-29T10:18:45-0500
    //FMLAT: accesstransformer.cfg
    //FMLCorePluginContainsFMLMod: true
    //FMLCorePlugin: micdoodle8.mods.miccore.MicdoodlePlugin
    //Built-On-Minecraft: 1.12.2
    //Built-On-Forge: 14.23.5.2860
    //Built-On-Mapping: stable-39-1.12
    //Built-Using: ForgeGradle: 5.1.+
}
dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    compileOnly runtimeOnly( (':Mekanism-1.12.2:9.8.3.390') )
    compileOnly runtimeOnly( (':industrialcraft-2:2.8.222-ex112') )
    compileOnly runtimeOnly( (':buildcraft-api:7.99.24.8') )
    compileOnly (':BiomesOPlenty-1.12.2:7.0.1.2445-universal')
    compileOnly (':appliedenergistics2:rv6-stable-7')
    compileOnly (':RedstoneFlux-1.12:2.1.1.1-universal')
    compileOnly (':ActuallyAdditions-1.12.2:r152')
    compileOnly (':PlayerAPI-1.12.2:1.1')
    compileOnly (':journeymap-1.12.2:5.7.1')
    compileOnly (':jei_1.12.2:4.16.1.302:api')
    runtimeOnly (':jei_1.12.2:4.16.1.302')

    // Project lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    testCompileOnly 'org.projectlombok:lombok:1.18.24'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.24'
}

spotless {
    enforceCheck false
    java {
        target 'src/*/java/micdoodle8/mods/**/*.java'
        endWithNewline()
        trimTrailingWhitespace()
        removeUnusedImports()
        indentWithSpaces()
    }
}

license {
    header = project.file('etc/HEADER')
    properties {
        company = 'Team Galacticraft'
        year = "2023"
    }
    ignoreFailures = true
    include '**/*.java'
}

clean {
    def filteredDelete = new HashSet<>()
    for (def toDelete : getDelete()) {
        for (def f : file(toDelete).listFiles()) {
            if (f.getName() != "fg_cache") {
                filteredDelete.add(f)
            }
        }
    }
    setDelete(filteredDelete)
}

